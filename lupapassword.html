<!doctype html>
<html lang="id">
  <head>
    <script src="translations.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="forgotPasswordTitle">Lupa Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇰🇷</text></svg>"
    />
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
  </head>

  <body>
    <header>
      <nav>
        <button class="logo" id="menuToggle" aria-label="Buka menu">
          <span class="menu-icon">☰</span>
        </button>

        <ul class="nav-links">
          <li>
            <a href="index.html#home" data-i18n="navHome">Home</a>
          </li>
          <li>
            <a href="tentang.html" data-i18n="navAbout">Tentang</a>
          </li>
          <li>
            <a href="proyek.html" data-i18n="navProjects">Proyek</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1 data-i18n="forgotPasswordTitle">Lupa Password</h1>
        <p class="auth-sub" data-i18n="forgotPasswordSubtitle">
          Masukkan email kamu. Kami akan kirim link untuk reset password.
        </p>

        <div id="errorMessage" class="auth-error"></div>
        <div id="successMessage" class="auth-success" style="display:none;"></div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label for="email" data-i18n="emailLabel">Email</label>
            <input
              id="email"
              type="email"
              data-i18n-placeholder="emailPlaceholder"
              autocomplete="email"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-block"
            id="resetBtn"
            data-i18n="sendResetLink"
          >
            📧 Kirim Link Reset
          </button>
        </form>

        <p class="auth-switch">
          <a href="login.html" data-i18n="backToLogin">← Kembali ke Login</a>
        </p>
      </section>
    </main>

    <footer>
      <p data-i18n="footerText">
        © 2026 Muhammad Haedar Rizky Anwar. 화이팅! 🇰🇷
      </p>
    </footer>

    <style>
      .auth-success {
        margin: 12px 0;
        padding: 12px 14px;
        color: #065f46;
        font-size: 14px;
        text-align: center;
        background: #d1fae5;
        border: 1px solid #a7f3d0;
        border-radius: 10px;
      }
    </style>

    <script>
      const forgotPasswordForm = document.getElementById("forgotPasswordForm");
      const resetBtn = document.getElementById("resetBtn");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
        successMessage.style.display = "none";
      }

      function hideError() {
        errorMessage.textContent = "";
        errorMessage.classList.remove("show");
      }

      function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.style.display = "block";
        errorMessage.textContent = "";
        errorMessage.classList.remove("show");
      }

      forgotPasswordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError();

        const email = document
          .getElementById("email")
          .value.trim()
          .toLowerCase();

        resetBtn.disabled = true;
        resetBtn.textContent = "Mengirim...";

        try {
          await auth.sendPasswordResetEmail(email);
          showSuccess(
            "Link reset password telah dikirim ke email kamu. Silakan cek inbox (dan folder spam)."
          );
          forgotPasswordForm.reset();
        } catch (error) {
          let message = "Gagal mengirim link reset. Silakan coba lagi.";
          if (error.code === "auth/invalid-email")
            message = "Format email tidak valid.";
          else if (error.code === "auth/user-not-found")
            message = "Email belum terdaftar.";
          else if (error.code === "auth/too-many-requests")
            message = "Terlalu banyak percobaan. Coba lagi nanti.";
          showError(message);
        } finally {
          resetBtn.disabled = false;
          resetBtn.innerHTML = "📧 Kirim Link Reset";
        }
      });

      const menuToggle = document.getElementById("menuToggle");
      const navLinksEl = document.querySelector(".nav-links");
      if (menuToggle && navLinksEl) {
        menuToggle.addEventListener("click", () =>
          navLinksEl.classList.toggle("open")
        );
      }
    </script>
  </body>
</html>
