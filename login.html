<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="loginTitle">
      Login
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇰🇷</text></svg>"
    />

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="translations.js"></script>
    <script src="auth.js"></script>
  </head>

  <body>
    <header>
      <nav>
        <button
          class="logo"
          id="menuToggle"
          type="button"
          aria-label="Buka menu"
        >
          <span class="menu-icon">☰</span>
        </button>

        <ul class="nav-links">
          <li>
            <a href="index.html#home" data-i18n="navHome">
              Home
            </a>
          </li>

          <li>
            <a href="tentang.html" data-i18n="navAbout">
              Tentang
            </a>
          </li>

          <li>
            <a href="proyek.html" data-i18n="navProjects">
              Proyek
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1 data-i18n="loginTitle">
          Selamat Datang!
        </h1>

        <p class="auth-sub" data-i18n="loginSubtitle">
          Login untuk melanjutkan belajar bahasa Korea.
        </p>

        <div id="errorMessage" class="auth-error"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email" data-i18n="emailLabel">
              Email
            </label>

            <input
              id="email"
              type="email"
              data-i18n-placeholder="emailPlaceholder"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" data-i18n="passwordLabel">
              Password
            </label>

            <input
              id="password"
              type="password"
              data-i18n-placeholder="passwordPlaceholder"
              autocomplete="current-password"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-block"
            id="loginBtn"
            data-i18n="loginSubmit"
          >
            🔑 Login
          </button>
        </form>

        <p class="auth-switch">
          <a
            href="lupapassword.html"
            data-i18n="forgotPassword"
          >
            Lupa password?
          </a>

          <br /><br />

          <span data-i18n="noAccount">
            Belum punya akun?
          </span>

          <a
            href="register.html"
            data-i18n="registerNow"
          >
            Daftar sekarang
          </a>

          <br /><br />

          <a
            href="index.html"
            data-i18n="backToHome"
          >
            ← Kembali ke Home
          </a>
        </p>
      </section>
    </main>

    <footer>
      <p data-i18n="footerText">
        © 2026 Muhammad Haedar Rizky Anwar. 화이팅! 🇰🇷
      </p>
    </footer>

    <script>
      const loginForm =
        document.getElementById("loginForm");

      const loginButton =
        document.getElementById("loginBtn");

      const errorMessage =
        document.getElementById("errorMessage");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
      }

      function hideError() {
        errorMessage.textContent = "";
        errorMessage.classList.remove("show");
      }

      loginForm.addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();
          hideError();

          const email =
            document.getElementById(
              "email"
            ).value.trim().toLowerCase();

          const password =
            document.getElementById(
              "password"
            ).value;

          loginButton.disabled = true;
          loginButton.textContent =
            "Memproses...";

          try {
            await auth.signInWithEmailAndPassword(
              email,
              password
            );

            localStorage.setItem(
              "userEmail",
              email
            );

            window.location.href =
              "index.html";
          } catch (error) {
            console.error("Login error:", error);

            let message =
              "Gagal login. Silakan coba lagi.";

            if (
              error.code ===
              "auth/user-not-found"
            ) {
              message = "Email belum terdaftar.";
            } else if (
              error.code ===
                "auth/wrong-password" ||
              error.code ===
                "auth/invalid-credential"
            ) {
              message =
                "Email atau password salah.";
            } else if (
              error.code ===
              "auth/invalid-email"
            ) {
              message =
                "Format email tidak valid.";
            }

            showError(message);
          } finally {
            loginButton.disabled = false;
            loginButton.textContent =
              "🔑 Login";
          }
        }
      );
    </script>
  </body>
</html>
